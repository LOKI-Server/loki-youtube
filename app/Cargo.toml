[package]
name = "media-downloader"
version = "0.2.1"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
loki-sdk = { version = "0.9.0", features = ["templates"] }
askama = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.loki]
id = "media-downloader"
name = "Media Downloader"
description = "Save videos and audio from YouTube and the other sites yt-dlp supports, using the yt-dlp installed on your server."
health = "/health"
roles = ["admin"]
panel = true
capabilities = ["outbound", "database", "storage"]
outbound = ["127.0.0.1:44317"]
schedules = [{ name = "maintain", every_minutes = 1 }]

[package.metadata.loki.limits]
memory_mib = 96
fuel = 10000000000
timeout_seconds = 120
concurrent_requests = 8
request_bytes = 16384
storage_mib = 4096
storage_entries = 4096
